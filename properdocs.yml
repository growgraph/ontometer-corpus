site_name: OntoMeter Corpus
site_description: A corpus of public ontologies, the pipeline that derives its tables, and the analysis of the paper that describes it
site_url: https://growgraph.github.io/ontometer-corpus/
repo_url: https://github.com/growgraph/ontometer-corpus
repo_name: growgraph/ontometer-corpus
copyright: Copyright &copy; 2025-2026 GrowGraph
edit_uri: edit/main/docs/
theme:
    name: material
    user_color_mode_toggle: true
    # Colours are set in docs/stylesheets/extra.css.
    palette:
    -   scheme: default
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch-off-outline
            name: Switch to dark mode
    -   scheme: slate
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch
            name: Switch to light mode
    font:
        text: Source Sans 3
        code: JetBrains Mono
    # The mark on its white disc: bare plum on the ink header is too faint.
    logo: assets/logo.svg
    icon:
        repo: fontawesome/brands/github
    favicon: assets/favicon.svg
    features:
    -   navigation.tabs
    -   navigation.tabs.sticky
    -   navigation.top
    -   navigation.footer
    -   toc.follow
    -   content.code.copy
    -   content.action.edit
    -   search.highlight
    -   search.suggest
extra_css:
-   https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap
-   stylesheets/extra.css
exclude_docs: |
    _build/
plugins:
# Underscores are separators, so `role_share` is indexed as its words as well
# as whole; without this an identifier is one opaque token.
-   search:
        separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|_'
-   glightbox
-   gen-files:
        scripts:
        -   docs/_build/gen_pages.py
-   literate-nav
-   mkdocstrings:
        default_handler: python
        handlers:
            python:
                options:
                    show_root_full_path: true
                    show_source: true
                    show_root_toc_entry: false
                    docstring_style: google
                    show_category_heading: true
                    show_if_no_docstring: true
                    members_order: source
validation:
    omitted_files: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
nav:
-   Home: index.md
-   Install and use: getting_started.md
-   The tables: tables.md
-   Pipeline:
    -   Overview: overview.md
    -   Fetch, parse, dedup: pipeline.md
    -   Object store: store.md
    -   Dependency network: network.md
    -   Rebuilding: rebuild.md
-   Measures:
    -   Abstractness: abstractness.md
    -   Dates: dates.md
    -   Abstractness race: growth.md
-   The paper: paper.md
-   API reference: reference/
-   Contributing: contributing.md
-   Changelog: changelog.md
markdown_extensions:
-   pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
-   pymdownx.inlinehilite
-   pymdownx.snippets:
        base_path: ["."]
        check_paths: true
-   pymdownx.superfences:
        custom_fences:
        -   name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
-   attr_list
-   md_in_html
-   admonition
-   codehilite
-   footnotes
-   meta
-   def_list
-   tables
-   pymdownx.blocks.caption
-   pymdownx.details
-   pymdownx.tabbed:
        alternate_style: true
-   pymdownx.emoji
-   pymdownx.tasklist
-   pymdownx.keys
-   pymdownx.magiclink
-   pymdownx.betterem
-   pymdownx.caret
-   pymdownx.tilde
-   pymdownx.mark
-   pymdownx.smartsymbols
-   pymdownx.escapeall
-   toc:
        permalink: true
